[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markitdown-pdf-plugin"
dynamic = ["version"]
description = 'A PDF converter plugin for the "markitdown" library.'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "markitdown>=0.1.0a1",
  "pypdf",
]

[tool.hatch.version]
path = "src/markitdown_pdf_plugin/__about__.py"

# IMPORTANT: MarkItDown will look for this entry point to find the plugin.
[project.entry-points."markitdown.plugin"]
pdf_plugin = "markitdown_pdf_plugin"

[tool.hatch.build.targets.sdist]
only-include = ["src/markitdown_pdf_plugin"]
